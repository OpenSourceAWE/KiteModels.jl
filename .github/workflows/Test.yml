name: Test

on:
  push:
    branches:
      - main
    tags: ["*"]
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1'
        os:
          - ubuntu-latest
        build_is_production_build:
          - true
        arch:
          - x64
        include:
          - os: windows-latest
            arch: x64
            version: 1
            build_is_production_build: true
          - os: macOS-latest
            arch: aarch64
            version: 1
            build_is_production_build: true
    steps:
      - uses: actions/checkout@v7
      
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          
      - name: Prepare version-specific manifest
        shell: bash
        run: |
          JULIA_VERSION=$(julia --version | awk '{print $3}' | cut -d'.' -f1,2)
          DEFAULT="Manifest-v${JULIA_VERSION}.toml.default"
          TARGET="Manifest-v${JULIA_VERSION}.toml"
          if [ -f "$DEFAULT" ] && [ ! -f "$TARGET" ]; then
            cp "$DEFAULT" "$TARGET"
            echo "Copied $DEFAULT to $TARGET"
          fi
      - name: Install xvfb for headless GL rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Start virtual framebuffer
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          
      - uses: julia-actions/cache@v3
        continue-on-error: true
        with:
          # packing the many small files of the compiled cache takes about 30 min on Windows
          cache-compiled: ${{ runner.os != 'Windows' }}
      - uses: julia-actions/julia-buildpkg@v1
      - name: Resolve and instantiate test environment
        shell: bash
        # julia-runtest precompiles with its own flags (--check-bounds=yes), so precompiling
        # here with the default flags would compile all dependencies twice
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        run: |
          julia --project=test -e "using Pkg; Pkg.resolve(); Pkg.instantiate()"
      
      - uses: julia-actions/julia-runtest@v1
        env:
          BUILD_IS_PRODUCTION_BUILD: ${{ matrix.build_is_production_build }}
        with:
          coverage: false
          
  test-with-code-coverage:
    name: Julia ${{ matrix.julia_version }} - ${{ matrix.os }} - ${{ matrix.julia_arch }} - with code coverage
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        julia_version:
          - "1.12"
        julia_arch:
          - x64
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    
    - uses: julia-actions/setup-julia@v3
      with:
        arch: ${{ matrix.julia_arch }}
        version: ${{ matrix.julia_version }}
        
    - name: Prepare version-specific manifest
      shell: bash
      run: |
        JULIA_VERSION=$(julia --version | awk '{print $3}' | cut -d'.' -f1,2)
        DEFAULT="Manifest-v${JULIA_VERSION}.toml.default"
        TARGET="Manifest-v${JULIA_VERSION}.toml"
        if [ -f "$DEFAULT" ] && [ ! -f "$TARGET" ]; then
          cp "$DEFAULT" "$TARGET"
          echo "Copied $DEFAULT to $TARGET"
        fi
    - name: Install xvfb for headless GL rendering
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb
    - name: Start virtual framebuffer
      if: runner.os == 'Linux'
      run: |
        Xvfb :99 -screen 0 1024x768x24 &
        echo "DISPLAY=:99" >> $GITHUB_ENV
        
    - uses: julia-actions/cache@v3
      continue-on-error: true
    - uses: julia-actions/julia-buildpkg@v1
    - name: Resolve and instantiate test environment
      shell: bash
      # julia-runtest precompiles with its own flags (--check-bounds=yes), so precompiling
      # here with the default flags would compile all dependencies twice
      env:
        JULIA_PKG_PRECOMPILE_AUTO: 0
      run: |
        julia --project=test -e "using Pkg; Pkg.resolve(); Pkg.instantiate()"
    
    - uses: julia-actions/julia-runtest@v1
      env:
        BUILD_IS_PRODUCTION_BUILD: false
        
    - uses: julia-actions/julia-processcoverage@v1
    
    - uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
      continue-on-error: true
