name: Reusable test

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: "1"
      os:
        required: false
        type: string
        default: ubuntu-latest
      arch:
        required: false
        type: string
        default: x64
      allow_failure:
        required: false
        type: boolean
        default: false
      run_codecov:
        required: false
        type: boolean
        default: false
      build_is_production_build:
        required: false
        type: string
        default: "true"
    secrets:
      codecov_token:
        required: true

jobs:
  test:
    name: Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ inputs.arch }} - ${{ github.event_name }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 80
    continue-on-error: ${{ inputs.allow_failure }}

    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.version }}
          arch: ${{ inputs.arch }}
      - name: Use Julia cache
        uses: julia-actions/cache@v3
        continue-on-error: true
      - name: Prepare version-specific manifest
        shell: bash
        run: |
          JULIA_VERSION=$(julia --version | awk '{print $3}' | cut -d'.' -f1,2)
          DEFAULT="Manifest-v${JULIA_VERSION}.toml.default"
          TARGET="Manifest-v${JULIA_VERSION}.toml"
          if [ -f "$DEFAULT" ] && [ ! -f "$TARGET" ]; then
            cp "$DEFAULT" "$TARGET"
            echo "Copied $DEFAULT to $TARGET"
          fi
      - name: Install xvfb for headless GL rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Start virtual framebuffer
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      - name: Resolve and instantiate test environment
        shell: bash
        run: |
          JULIA_VERSION=$(julia --version | awk '{print $3}' | cut -d'.' -f1,2)
          TEST_MANIFEST="test/Manifest-v${JULIA_VERSION}.toml"
          TEST_TARGET="test/Manifest.toml"
          if [ -f "$TEST_MANIFEST" ] && [ ! -f "$TEST_TARGET" ]; then
            cp "$TEST_MANIFEST" "$TEST_TARGET"
            echo "Copied $TEST_MANIFEST to $TEST_TARGET"
          fi
          julia --project=test -e "using Pkg; Pkg.resolve(); Pkg.instantiate()"
      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        env:
          BUILD_IS_PRODUCTION_BUILD: ${{ inputs.build_is_production_build }}
        with:
          coverage: ${{ inputs.run_codecov }}
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ inputs.run_codecov }}
      - uses: codecov/codecov-action@v6
        if: ${{ inputs.run_codecov }}
        with:
          files: lcov.info
          token: ${{ secrets.codecov_token }}
